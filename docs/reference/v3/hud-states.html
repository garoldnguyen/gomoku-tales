<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUD states</title>
<link rel="stylesheet" href="hud.render.css"><style>html,body{margin:0;background:#1b2230}.stage{position:relative;width:1720px;height:640px;overflow:hidden}.stage>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.row{position:absolute;left:80px;top:60px;display:flex;gap:40px}.card.static{position:static;--team:var(--blue)}.card.right.static{--team:var(--red);--team-soft:var(--red-soft);--team-tile:var(--red-tile);--team-ink:var(--red-ink)}.card.left.static{--team:var(--blue);--team-soft:var(--blue-soft);--team-tile:var(--blue-tile);--team-ink:var(--blue-ink)}.card.is-winner.static{--team-tile:var(--gold-tile);--team-soft:var(--gold-soft);--team-ink:var(--gold-ink)}.cap{position:absolute;left:80px;top:560px;display:flex;gap:40px;font:600 17px "DM Sans",sans-serif;color:#fff}.cap div{width:332px}</style></head>
<body><div class="stage"><img class="bg" src="scene-medium.jpg" alt=""><div class="hud" data-quality="high"><div class="row"><section class="card left static  glass" aria-label="Wind Rabbit">
<div class="who-row"><div class="tile"><img src="portrait-wind-rabbit.png" alt=""></div><div><div class="name">Wind Rabbit</div><div class="meta">Plays X, 7 planted</div></div></div>
<div class="chip">Your turn</div><div class="rule"></div><div class="label">SKILLS</div>
<div class="skills"><button class="skill " type="button"><span class="ico"><img src="icon-wind-dash.png" alt=""><span class="ring"></span><span class="count"></span></span><span class="t"><span class="title">Wind Dash</span><span class="state">Ready</span></span></button><button class="skill " type="button"><span class="ico"><img src="icon-tornado-zone.png" alt=""><span class="ring"></span><span class="count"></span></span><span class="t"><span class="title">Tornado Zone</span><span class="state">Ready</span></span></button></div></section><section class="card left static  glass" aria-label="Wind Rabbit">
<div class="who-row"><div class="tile"><img src="portrait-wind-rabbit.png" alt=""></div><div><div class="name">Wind Rabbit</div><div class="meta">Plays X, 7 planted</div></div></div>
<div class="chip">Your turn</div><div class="rule"></div><div class="label">SKILLS</div>
<div class="skills"><button class="skill is-selected" type="button"><span class="ico"><img src="icon-wind-dash.png" alt=""><span class="ring"></span><span class="count"></span></span><span class="t"><span class="title">Wind Dash</span><span class="state">Selected</span></span></button><button class="skill " type="button"><span class="ico"><img src="icon-tornado-zone.png" alt=""><span class="ring"></span><span class="count"></span></span><span class="t"><span class="title">Tornado Zone</span><span class="state">Ready</span></span></button></div></section><section class="card right static is-waiting glass" aria-label="Earth Bear">
<div class="who-row"><div class="tile"><img src="portrait-earth-bear.png" alt=""></div><div><div class="name">Earth Bear</div><div class="meta">Plays O, 7 planted</div></div></div>
<div class="chip">Waiting</div><div class="rule"></div><div class="label">SKILLS</div>
<div class="skills"><button class="skill is-cooling" type="button"><span class="ico"><img src="icon-terrain-creation.png" alt=""><span class="ring" style="--p:33"></span><span class="count">2</span></span><span class="t"><span class="title">Terrain Creation</span><span class="state">Ready in 2 turns</span></span></button><button class="skill is-off" type="button" disabled><span class="ico"><img src="icon-stone-conversion.png" alt=""><span class="ring"></span><span class="count"></span></span><span class="t"><span class="title">Stone Conversion</span><span class="state">Wait for your turn</span></span></button></div></section><section class="card left static is-winner glass" aria-label="Wind Rabbit">
<div class="who-row"><div class="tile"><img src="portrait-wind-rabbit.png" alt=""></div><div><div class="name">Wind Rabbit</div><div class="meta">Plays X, 8 planted</div></div></div>
<div class="chip">Winner</div><div class="rule"></div><div class="label">SKILLS</div>
<div class="skills"><button class="skill is-off" type="button" disabled><span class="ico"><img src="icon-wind-dash.png" alt=""><span class="ring"></span><span class="count"></span></span><span class="t"><span class="title">Wind Dash</span><span class="state">Round over</span></span></button><button class="skill is-off" type="button" disabled><span class="ico"><img src="icon-tornado-zone.png" alt=""><span class="ring"></span><span class="count"></span></span><span class="t"><span class="title">Tornado Zone</span><span class="state">Round over</span></span></button></div></section></div><div class="cap"><div>Your turn</div><div>A skill is selected</div><div>Waiting, cooling down</div><div>Round won</div></div></div></div></body></html>
