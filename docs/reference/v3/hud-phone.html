<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUD on a phone</title>
<link rel="stylesheet" href="hud.render.css"><style>html,body{margin:0;background:#1b2230}.stage{position:relative;width:390px;height:844px;overflow:hidden}.stage>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}</style></head>
<body><div class="stage"><img class="bg" src="scene-medium.jpg" alt=""><div class="hud" data-quality="high"><div class="topbar"><div class="turn glass" style="--team:var(--blue)" role="status"><span class="dot"></span><span class="who">Wind Rabbit's turn</span><span class="hint">Plant a seed</span></div></div>
<div class="quality glass" role="group" aria-label="Quality"><button type="button" aria-pressed="false">Low</button><button type="button" aria-pressed="false">Medium</button><button type="button" aria-pressed="true">High</button></div><section class="card left  glass" aria-label="Wind Rabbit">
<div class="who-row"><div class="tile"><img src="portrait-wind-rabbit.png" alt=""></div><div><div class="name">Wind Rabbit</div><div class="meta">Plays X, 7 planted</div></div></div>
<div class="chip">Your turn</div><div class="rule"></div><div class="label">SKILLS</div>
<div class="skills"><button class="skill " type="button"><span class="ico"><img src="icon-wind-dash.png" alt=""><span class="ring"></span><span class="count"></span></span><span class="t"><span class="title">Wind Dash</span><span class="state">Ready</span></span></button><button class="skill " type="button"><span class="ico"><img src="icon-tornado-zone.png" alt=""><span class="ring"></span><span class="count"></span></span><span class="t"><span class="title">Tornado Zone</span><span class="state">Ready</span></span></button></div></section><section class="card right is-waiting glass" aria-label="Earth Bear">
<div class="who-row"><div class="tile"><img src="portrait-earth-bear.png" alt=""></div><div><div class="name">Earth Bear</div><div class="meta">Plays O, 7 planted</div></div></div>
<div class="chip">Waiting</div><div class="rule"></div><div class="label">SKILLS</div>
<div class="skills"><button class="skill is-cooling" type="button"><span class="ico"><img src="icon-terrain-creation.png" alt=""><span class="ring" style="--p:33"></span><span class="count">2</span></span><span class="t"><span class="title">Terrain Creation</span><span class="state">Ready in 2 turns</span></span></button><button class="skill is-off" type="button" disabled><span class="ico"><img src="icon-stone-conversion.png" alt=""><span class="ring"></span><span class="count"></span></span><span class="t"><span class="title">Stone Conversion</span><span class="state">Wait for your turn</span></span></button></div></section></div></div></body></html>
