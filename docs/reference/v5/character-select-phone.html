<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Character select, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap">
</helmet>
<div style="position:relative; width:390px; height:844px; overflow:hidden; background:#1b2a1e; color:#f4f7fb; font-family:Nunito, system-ui, sans-serif;">
  <div style="position:absolute; left:0; top:0; right:0; bottom:0; background:rgba(8,12,20,0.5); backdrop-filter:blur(6px);"></div>

  <div style="position:absolute; left:12px; right:12px; top:50%; transform:translateY(-50%); box-sizing:border-box; padding:28px 16px 22px; border-radius:22px; border:3px solid rgba(255,255,255,0.22); background:rgba(14,20,34,0.86); box-shadow:0 8px 0 #0e1422; display:flex; flex-direction:column; align-items:center; gap:20px;">

    <div style="text-align:center;">
      <div style="font-size:28px; font-weight:800; text-shadow:0 3px 0 #0e1422;">Choose your character</div>
      <div style="margin-top:8px; font-size:14px; color:rgba(244,247,251,0.7); line-height:1.5;">The first to pick plays X and moves first. The second plays O.</div>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px; width:100%;">

      <button type="button" style="appearance:none; box-sizing:border-box; width:100%; padding:12px; margin:0; border-radius:16px; border:3px solid #ffe14d; background:#141f36; color:#f4f7fb; font:inherit; text-align:left; display:flex; gap:14px; align-items:center; box-shadow:0 5px 0 #0e1422; cursor:pointer;">
        <div style="width:76px; height:76px; border-radius:12px; background:rgba(59,140,255,0.2); flex-shrink:0; display:flex; align-items:center; justify-content:center;">
          <svg width="56" height="56" viewBox="0 0 100 100" aria-hidden="true">
            <g fill="#3b8cff"><circle cx="50" cy="28" r="16"/><circle cx="50" cy="72" r="16"/><circle cx="28" cy="50" r="16"/><circle cx="72" cy="50" r="16"/></g>
            <circle cx="50" cy="50" r="9" fill="#cfe4ff"/>
          </svg>
        </div>
        <div style="display:flex; flex-direction:column; gap:4px; min-width:0;">
          <div style="font-size:20px; font-weight:800;">Wind Rabbit</div>
          <div style="font-size:13px; color:rgba(244,247,251,0.7); font-style:italic;">Fast and hard to read.</div>
          <div style="font-size:13px; color:rgba(244,247,251,0.7);">Wind Dash, 3 turns</div>
          <div style="font-size:13px; color:rgba(244,247,251,0.7);">Tornado Zone, 6 turns</div>
        </div>
      </button>

      <button type="button" style="appearance:none; box-sizing:border-box; width:100%; padding:12px; margin:0; border-radius:16px; border:3px solid rgba(255,255,255,0.14); background:#141f36; color:#f4f7fb; font:inherit; text-align:left; display:flex; gap:14px; align-items:center; box-shadow:0 5px 0 #0e1422; cursor:pointer;">
        <div style="width:76px; height:76px; border-radius:12px; background:rgba(255,75,92,0.18); flex-shrink:0; display:flex; align-items:center; justify-content:center;">
          <svg width="56" height="56" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="34" fill="#ff4b5c"/>
            <circle cx="50" cy="50" r="13" fill="#ffd0d5"/>
          </svg>
        </div>
        <div style="display:flex; flex-direction:column; gap:4px; min-width:0;">
          <div style="font-size:20px; font-weight:800;">Earth Bear</div>
          <div style="font-size:13px; color:rgba(244,247,251,0.7); font-style:italic;">Slow and steady.</div>
          <div style="font-size:13px; color:rgba(244,247,251,0.7);">Terrain Creation, 3 turns</div>
          <div style="font-size:13px; color:rgba(244,247,251,0.7);">Stone Conversion, 6 turns</div>
        </div>
      </button>

      <button type="button" style="appearance:none; box-sizing:border-box; width:100%; padding:12px; margin:0; border-radius:16px; border:3px solid rgba(255,255,255,0.14); background:#141f36; color:#f4f7fb; font:inherit; text-align:left; display:flex; gap:14px; align-items:center; box-shadow:0 5px 0 #0e1422; cursor:pointer;">
        <div style="width:76px; height:76px; border-radius:12px; background:rgba(143,227,168,0.16); flex-shrink:0; display:flex; align-items:center; justify-content:center;">
          <svg width="56" height="56" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="36" fill="#8fe3a8"/>
            <path d="M50 22 C 70 34, 70 66, 50 78 C 34 66, 34 34, 50 22 Z" fill="#cfeee0"/>
          </svg>
        </div>
        <div style="display:flex; flex-direction:column; gap:4px; min-width:0;">
          <div style="font-size:20px; font-weight:800;">Jade Serpent</div>
          <div style="font-size:13px; color:rgba(244,247,251,0.7); font-style:italic;">Patient, then sudden.</div>
          <div style="font-size:13px; color:rgba(244,247,251,0.7);">Hiss, 3 turns</div>
          <div style="font-size:13px; color:rgba(244,247,251,0.7);">Venom, 6 turns</div>
        </div>
      </button>

    </div>

    <div style="display:flex; flex-direction:column; gap:12px; width:100%; align-items:center;">
      <button type="button" style="appearance:none; width:100%; height:54px; border-radius:14px; border:0; background:#ffe14d; color:#0e1422; font:inherit; font-size:19px; font-weight:800; box-shadow:0 5px 0 #b59a1f; cursor:pointer;">Ready</button>
      <button type="button" style="appearance:none; border:0; background:none; padding:4px; color:rgba(244,247,251,0.7); font:inherit; font-size:15px; font-weight:600; cursor:pointer;">Back</button>
    </div>

  </div>
</div>
</x-dc>

  renderVals() { return {}; }

</body>
</html>
