<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gomoku Tales</title>
  <!-- No favicon file: an empty icon keeps the browser from requesting /favicon.ico (a 404 in the console). -->
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #14121c;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    [hidden] {
      display: none !important;
    }
    /* Internal resolution is 960x540; scale to fit the window at 16:9.
       --u is one internal pixel, so the DOM screens scale with the canvas. */
    #stage {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      --u: calc(min(100vw, 100vh * 16 / 9) / 960);
      overflow: hidden;
    }
    /* The WebGL world (#world) lies under the 2D canvas (#game), which
       draws the whole 2D game or, over the 3D world, only small overlays.
       The 3D game's HUD is the DOM glass overlay #hud (src/ui/hud.css). */
    #stage canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }
    #game {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    /* Behind the lobby and room screens the 3D world is blurred (not on
       LOW quality, see src/render3d/quality.js menuBlur). The slight zoom
       hides the dark fringe a blur leaves at the edges; #stage clips it. */
    #stage.backdrop-blur #world {
      filter: blur(calc(var(--u) * 2.5));
      transform: scale(1.04);
    }
  </style>
  <!-- Three.js is vendored (see vendor/VERSION.txt); nothing loads from the network. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
  <link rel="stylesheet" href="src/ui/screens.css">
  <link rel="stylesheet" href="src/ui/hud.css">
</head>
<body>
  <div id="stage">
    <canvas id="world" hidden></canvas>
    <canvas id="game" width="960" height="540"></canvas>

    <!-- Lobby and room screens (docs/design.md section 3), shown over the canvas. -->
    <div id="screens" hidden>
      <section class="card" data-screen="lobby">
        <p class="lead">Five in a row, with wind and earth skills.</p>
        <button type="button" data-action="openCreate">Create Room</button>
        <button type="button" data-action="openJoin">Join Room</button>
      </section>

      <section class="card" data-screen="create">
        <h2>Create Room</h2>
        <p>Pick your character. Your opponent gets the other one.</p>
        <div class="choices" id="character-choices"></div>
        <button type="button" class="secondary" data-action="backToLobby">Back</button>
      </section>

      <section class="card" data-screen="join">
        <h2>Join Room</h2>
        <form id="join-form" class="join-row" autocomplete="off">
          <label for="join-code">Room code</label>
          <input id="join-code" name="code" maxlength="12" spellcheck="false" placeholder="ABCDE">
          <button type="submit" id="join-submit">Join</button>
        </form>
        <p class="error" id="join-error" role="alert"></p>
        <p class="note" id="join-status"></p>
        <button type="button" class="secondary" data-action="backToLobby">Back</button>
      </section>

      <section class="card" data-screen="waiting">
        <h2>Room code</h2>
        <div class="code-row">
          <output class="code" id="room-code"></output>
          <button type="button" id="copy-code">Copy</button>
        </div>
        <p class="note" id="copy-status" aria-live="polite"></p>
        <p class="waiting">Waiting for opponent</p>
        <p class="note" id="waiting-character"></p>
        <button type="button" class="secondary" data-action="backToLobby">Cancel</button>
      </section>

      <section class="card" data-screen="gameOver">
        <h2 id="over-title"></h2>
        <p id="over-detail"></p>
        <button type="button" data-action="backToLobby">Back to Lobby</button>
      </section>
    </div>
  </div>
  <!-- Glass HUD over the 3D world (docs/art-direction-v3.md section 8), built by src/ui/hud.js. -->
  <div id="hud" hidden></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
