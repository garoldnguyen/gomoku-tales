<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gomoku Tales</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #14121c;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    [hidden] {
      display: none !important;
    }
    /* Internal resolution is 960x540; scale to fit the window at 16:9.
       --u is one internal pixel, so the DOM screens scale with the canvas. */
    #stage {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      --u: calc(min(100vw, 100vh * 16 / 9) / 960);
      overflow: hidden;
    }
    /* The WebGL world (#world) lies under the 2D canvas (#game), which
       draws the whole 2D game or, over the 3D world, only small overlays.
       The 3D game's HUD is the DOM glass overlay #hud (src/ui/hud.css). */
    #stage canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }
    #game {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    /* The 3D game (body.world-3d, set by src/main.js) fills the whole
       window at any shape, with no 16:9 box, margin or bars
       (docs/art-direction-v3-1.md section 3): the WebGL canvas (#world)
       covers it and takes the pointer, and the camera adapts to its shape.
       The 2D overlay canvas (#game: banners, quality line, menu title)
       stays a 16:9 box in the middle that lets the pointer through. The
       2D renderer (?render=2d) keeps the 16:9 stage above. */
    body.world-3d #stage {
      position: fixed;
      inset: 0;
      width: auto;
      height: auto;
    }
    body.world-3d #game {
      inset: 0;
      margin: auto;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      pointer-events: none;
    }
    /* Behind the lobby and room screens the 3D world is blurred (not on
       LOW quality, see src/render3d/quality.js menuBlur). The slight zoom
       hides the dark fringe a blur leaves at the edges; #stage clips it. */
    #stage.backdrop-blur #world {
      filter: blur(calc(var(--u) * 2.5));
      transform: scale(1.04);
    }
  </style>
  <!-- Three.js is vendored (see vendor/VERSION.txt); nothing loads from the network. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
  <link rel="stylesheet" href="src/ui/screens.css">
  <link rel="stylesheet" href="src/ui/hud.css">
  <link rel="stylesheet" href="src/ui/menu.css">
  <link rel="stylesheet" href="src/ui/room.css">
</head>
<body>
  <div id="stage">
    <canvas id="world" hidden></canvas>
    <canvas id="game" width="960" height="540"></canvas>

    <!-- Lobby, room and game over screens (docs/flow-design.md sections 3.4, 3.5 and 3.7), shown over the canvas.
         src/ui/screens.js fills in the text from src/ui/strings.js. -->
    <div id="screens" hidden>
      <section class="card" data-screen="lobby" data-hud-box="lobby-panel">
        <p class="lead" id="lobby-lead"></p>
        <button type="button" id="lobby-create" data-action="openCreate" data-hud-box="lobby-create"></button>
        <button type="button" id="lobby-join" data-action="openJoin" data-hud-box="lobby-join"></button>
        <p class="note" id="lobby-hint"></p>
        <button type="button" class="secondary" id="lobby-back" data-action="back" data-hud-box="lobby-back"></button>
      </section>

      <section class="card" data-screen="create" data-hud-box="create-panel">
        <h2 id="create-title"></h2>
        <p id="create-lead"></p>
        <div class="choices" id="character-choices"></div>
        <button type="button" class="secondary back-button" data-action="backToLobby" data-hud-box="create-back"></button>
      </section>

      <section class="card" data-screen="join" data-hud-box="join-panel">
        <h2 id="join-title"></h2>
        <form id="join-form" class="join-row" autocomplete="off" novalidate>
          <label for="join-code" id="join-label"></label>
          <input id="join-code" name="code" spellcheck="false" autocapitalize="characters" placeholder="ABCD5" aria-describedby="join-error" data-hud-box="join-code">
          <button type="submit" id="join-submit" data-hud-box="join-submit"></button>
        </form>
        <p class="error" id="join-error" aria-live="polite"></p>
        <button type="button" class="secondary back-button" data-action="backToLobby" data-hud-box="join-back"></button>
      </section>

      <section class="card room-card" data-screen="waiting" data-hud-box="waiting-panel">
        <h2 id="waiting-title"></h2>
        <div class="code-row">
          <output class="code" id="room-code" data-hud-box="waiting-code"></output>
          <button type="button" id="copy-code" data-hud-box="waiting-copy"></button>
        </div>
        <p class="status" id="copy-status" aria-live="polite"></p>
        <p class="note" id="waiting-hint"></p>
        <div class="seats" id="waiting-cards"></div>
        <p class="status starting" id="waiting-starting" aria-live="polite"></p>
        <button type="button" class="secondary" id="waiting-leave" data-hud-box="waiting-leave"></button>
      </section>

      <!-- Game over card (docs/flow-design.md section 3.7): top centre, the finished board stays visible. -->
      <section class="card over-card" data-screen="gameOver" data-hud-box="gameover-card" aria-labelledby="over-title">
        <h2 id="over-title"></h2>
        <p id="over-detail"></p>
        <div class="over-actions">
          <button type="button" id="over-rematch" data-action="rematch" data-hud-box="gameover-rematch"></button>
          <button type="button" class="secondary" id="over-menu" data-action="backToMenu" data-hud-box="gameover-menu"></button>
        </div>
        <p class="status" id="over-hint" aria-live="polite"></p>
      </section>
    </div>
  </div>
  <!-- Glass HUD over the 3D world (docs/art-direction-v3.md section 8), built by src/ui/hud.js. -->
  <div id="hud" hidden></div>
  <!-- Main menu, How to Play and Settings (docs/flow-design.md section 3), built by src/ui/menu-dom.js. -->
  <div id="flow" hidden></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
